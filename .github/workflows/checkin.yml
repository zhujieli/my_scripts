name: WorkBuddy 每日签到

# 已暂停自动调度：GitHub 海外节点的会话被判失效（需国内网络环境）
# 如需恢复定时，取消下面两行注释即可
on:
  # schedule:
  #   - cron: '5 16 * * *'
  #   - cron: '35 16 * * *'
  workflow_dispatch: {}

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install websocket-client
      - name: 执行签到
        env:
          WB_COOKIE: ${{ secrets.WB_COOKIE }}
          WB_CHROME: google-chrome
        run: python checkin_ci.py
